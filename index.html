<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; font-src data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <title>GREY HERON</title>
    <style>
      :root {
        --gh-bg: #06100b;
        --gh-fg: #d8efd8;
        --gh-accent: #6ad16a;
        --gh-muted: #6a8a72;
        --gh-border: #143020;
        --gh-warn: #d8b86a;
        --gh-err: #d8756a;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--gh-bg);
        color: var(--gh-fg);
        font-family: ui-monospace, 'Cascadia Mono', 'Source Code Pro', Menlo, Consolas, monospace;
        font-size: 14px;
      }
      #app {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
